name: Release Note
permissions:
  contents: read
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to generate release notes for
        type: string
        required: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Get version and diff
        id: info
        run: |
          VERSION=$(grep "s.version" mollie-ruby-sdk.gemspec | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          SHA="${{ inputs.commit_sha || github.sha }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            git diff ${PREV_TAG} ${SHA} -- lib/ > "$RUNNER_TEMP/sdk.diff"
          else
            git diff ${SHA}~1 ${SHA} -- lib/ > "$RUNNER_TEMP/sdk.diff"
          fi
          echo "diff_file=$RUNNER_TEMP/sdk.diff" >> $GITHUB_OUTPUT

      - name: Summarise with Claude
        id: summary
        uses: mollie/mollie-api-release-note-generator@main
        with:
          diff_file: ${{ steps.info.outputs.diff_file }}

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
          SUMMARY: ${{ steps.summary.outputs.release_notes }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg version "$VERSION" \
              --arg summary "$SUMMARY" \
              --arg url "https://github.com/mollie/mollie-ruby-sdk/releases/tag/v$VERSION" '{
                embeds: [{
                  color: 13382701,
                  title: ("<:ruby:1575162401828110337> Ruby `v" + $version + "` is out 🎉"),
                  description: ("A shiny new version just dropped! ✨\nWhat changed? **Great question, glad you asked!**\n\n" + $summary + "\n\nCheck it out [here](" + $url + ")"),
                  url: $url
                }]
              }')"
